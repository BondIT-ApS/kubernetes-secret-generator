name: 🐳 Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * 0' # Weekly on Sunday at 22:40 UTC

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect file changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            if git diff --name-only HEAD~1 HEAD | grep -E '\.(py|txt)$|Dockerfile|requirements\.txt' > /dev/null; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  test-and-validation:
    name: 🧪 Test & Validate
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        run: |
          pylint app.py --rcfile=.pylintrc
        continue-on-error: false

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=70
        continue-on-error: false

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run Bandit security scan
        run: |
          bandit -r app.py -f json -o bandit-report.json || true
          bandit -r app.py -f txt -o bandit-report.txt || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report-${{ github.run_number }}
          path: |
            bandit-report.json
            bandit-report.txt
          retention-days: 90

  production-build:
    name: 🚀 Production Build & Publish
    runs-on: ubuntu-latest
    needs: [detect-changes, test-and-validation]
    if: needs.detect-changes.outputs.backend_changed == 'true' && needs.test-and-validation.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Secrets
        run: |
          echo "DOCKER_USERNAME is set: $([ -z "${{ secrets.DOCKER_USERNAME }}" ] && echo 'NO' || echo 'YES')"
          echo "DOCKER_PASSWORD is set: $([ -z "${{ secrets.DOCKER_PASSWORD }}" ] && echo 'NO' || echo 'YES')"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: docker.io

      - name: Generate semantic version tag
        id: version
        run: |
          # Semantic versioning: YY.M.PATCH
          YEAR=$(date +'%y')
          MONTH=$(date +'%-m')

          # Get patch number from git commits today
          PATCH=$(git rev-list --count --since="$(date +%Y-%m-%d)" HEAD)

          VERSION="${YEAR}.${MONTH}.${PATCH}"
          DATE_TAG=$(date +'%Y%m%d')

          {
            echo "version=${VERSION}"
            echo "date_tag=${DATE_TAG}"
            echo "year=${YEAR}"
            echo "month=${MONTH}"
          } >> "$GITHUB_OUTPUT"

          echo "Generated version: ${VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maboni82/kubernetes-secret-generator:latest
            maboni82/kubernetes-secret-generator:${{ steps.version.outputs.version }}
            maboni82/kubernetes-secret-generator:${{ steps.version.outputs.year }}.${{ steps.version.outputs.month }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Generate build summary
        run: |
          {
            echo "## 🐳 Docker Build Summary"
            echo ""
            echo "✅ Image built and pushed successfully!"
            echo ""
            echo "**Tags:**"
            echo "- \`maboni82/kubernetes-secret-generator:latest\`"
            echo "- \`maboni82/kubernetes-secret-generator:${{ steps.version.outputs.version }}\`"
            echo "- \`maboni82/kubernetes-secret-generator:${{ steps.version.outputs.year }}.${{ steps.version.outputs.month }}\`"
            echo ""
            echo "**Platforms:** linux/amd64, linux/arm64"
            echo ""
            echo "**SBOM & Provenance:** Included"
          } >> "$GITHUB_STEP_SUMMARY"

  weekly-security-scan:
    name: 🔐 Weekly Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
