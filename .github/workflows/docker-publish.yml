name: 🐳 Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * 0' # Weekly on Sunday at 22:40 UTC

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect file changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            if git diff --name-only HEAD~1 HEAD | grep -E '\.(py|txt)$|Dockerfile|requirements\.txt' > /dev/null; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  test-and-validation:
    name: 🧪 Test & Validate
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        run: |
          pylint app.py --rcfile=.pylintrc
        continue-on-error: false

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=70
        continue-on-error: false

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: main-branch
          name: kubernetes-secret-generator-main-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Run Bandit security scan
        run: |
          bandit -r app.py -f json -o bandit-report.json || true
          bandit -r app.py -f txt -o bandit-report.txt || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report-${{ github.run_number }}
          path: |
            bandit-report.json
            bandit-report.txt
          retention-days: 90

  production-build:
    name: 🚀 Production Build & Publish
    runs-on: ubuntu-latest
    needs: [detect-changes, test-and-validation]
    if: needs.detect-changes.outputs.backend_changed == 'true' && needs.test-and-validation.result == 'success'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Secrets
        run: |
          echo "DOCKER_USERNAME is set: $([ -z "${{ secrets.DOCKER_USERNAME }}" ] && echo 'NO' || echo 'YES')"
          echo "DOCKER_PASSWORD is set: $([ -z "${{ secrets.DOCKER_PASSWORD }}" ] && echo 'NO' || echo 'YES')"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: docker.io

      - name: Generate semantic version tag
        id: version
        run: |
          # Semantic versioning: YY.M.PATCH
          YEAR=$(date +'%y')
          MONTH=$(date +'%-m')
          PATCH=${{ github.run_number }}

          VERSION="${YEAR}.${MONTH}.${PATCH}"

          {
            echo "version=${VERSION}"
            echo "year=${YEAR}"
            echo "month=${MONTH}"
          } >> "$GITHUB_OUTPUT"

          echo "Generated version: ${VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maboni82/kubernetes-secret-generator:latest
            maboni82/kubernetes-secret-generator:${{ steps.version.outputs.version }}
            maboni82/kubernetes-secret-generator:${{ steps.version.outputs.year }}.${{ steps.version.outputs.month }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Generate build summary
        run: |
          {
            echo "## 🐳 Docker Build Summary"
            echo ""
            echo "✅ Image built and pushed successfully!"
            echo ""
            echo "**Tags:**"
            echo "- \`maboni82/kubernetes-secret-generator:latest\`"
            echo "- \`maboni82/kubernetes-secret-generator:${{ steps.version.outputs.version }}\`"
            echo "- \`maboni82/kubernetes-secret-generator:${{ steps.version.outputs.year }}.${{ steps.version.outputs.month }}\`"
            echo ""
            echo "**Platforms:** linux/amd64, linux/arm64"
            echo ""
            echo "**SBOM & Provenance:** Included"
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    needs: production-build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Create Git Tag
        run: |
          VERSION="${{ needs.production-build.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: 📝 Generate Release Notes
        id: release_notes
        run: |
          VERSION="${{ needs.production-build.outputs.version }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -20)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi

          {
            echo "## 🧱 Kubernetes Secret Generator ${VERSION}"
            echo ""
            echo "**Release Date:** $(date +'%Y-%m-%d')"
            echo ""
            echo "### 📦 Docker Images"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull maboni82/kubernetes-secret-generator:${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "### 🔄 Changes"
            echo ""
            echo "${CHANGELOG}"
          } > release_notes.md

      - name: 📦 Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = '${{ needs.production-build.outputs.version }}';
            const releaseNotes = fs.readFileSync('release_notes.md', 'utf8');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Release ${version}`,
              body: releaseNotes,
              draft: false,
              prerelease: false
            });

  weekly-security-scan:
    name: 🔐 Weekly Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
