name: 🔐 Dependabot Weekly Review

on:
  schedule:
    - cron: '12 20 * * 1' # Every Monday at 20:12 UTC (21:12 CET)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  dependency-check:
    name: 📦 Dependency Status Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for open Dependabot PRs
        id: dependabot_prs
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.name,
              state: 'open'
            });

            const dependabotPRs = pullRequests.filter(pr =>
              pr.user.login === 'dependabot[bot]'
            );

            let message = `## 🧱 Dependabot Status Report\n\n`;
            message += `**Report Date:** ${new Date().toISOString().split('T')[0]}\n\n`;

            if (dependabotPRs.length === 0) {
              message += `✅ **All dependencies are up to date!** No open Dependabot PRs.\n`;
            } else {
              message += `📦 **${dependabotPRs.length} Dependabot PR(s) pending review:**\n\n`;

              for (const pr of dependabotPRs) {
                const labels = pr.labels.map(l => l.name).join(', ');
                message += `- [#${pr.number}](${pr.html_url}) - ${pr.title}\n`;
                message += `  - Labels: ${labels || 'none'}\n`;
                message += `  - Created: ${new Date(pr.created_at).toLocaleDateString()}\n\n`;
              }

              message += `\n⚠️ **Action Required:** Review and merge these dependency updates.\n`;
            }

            core.setOutput('report', message);
            core.setOutput('pr_count', dependabotPRs.length);
            return message;

      - name: Create or update maintenance issue
        uses: actions/github-script@v8
        with:
          script: |
            const report = `${{ steps.dependabot_prs.outputs.report }}`;
            const prCount = ${{ steps.dependabot_prs.outputs.pr_count }};

            // Find existing maintenance issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.name,
              state: 'open',
              labels: 'maintenance,dependencies'
            });

            const existingIssue = issues.find(issue =>
              issue.title.includes('Weekly Dependency Maintenance')
            );

            const issueBody = report + '\n\n---\n*This issue is automatically updated weekly by the Dependabot Weekly Review workflow.*';

            if (prCount === 0 && existingIssue) {
              // Close issue if no PRs and issue exists
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.name,
                issue_number: existingIssue.number,
                state: 'closed'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.name,
                issue_number: existingIssue.number,
                body: '✅ All dependencies are up to date. Closing this maintenance issue.'
              });
            } else if (prCount > 0) {
              if (existingIssue) {
                // Update existing issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.name,
                  issue_number: existingIssue.number,
                  body: issueBody
                });
              } else {
                // Create new issue
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.name,
                  title: '🔐 Weekly Dependency Maintenance',
                  body: issueBody,
                  labels: ['maintenance', 'dependencies']
                });
              }
            }

  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit security scan
        run: |
          bandit -r app.py -f json -o bandit-weekly-report.json || true
          bandit -r app.py -f txt -o bandit-weekly-report.txt || true
        continue-on-error: true

      - name: Convert Bandit JSON to SARIF
        run: |
          pip install bandit-sarif-formatter
          bandit -r app.py -f sarif -o bandit-weekly-report.sarif || true
        continue-on-error: true

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-weekly-report.sarif
          category: bandit-weekly

      - name: Upload Bandit reports
        uses: actions/upload-artifact@v6
        with:
          name: bandit-weekly-security-report-${{ github.run_number }}
          path: |
            bandit-weekly-report.json
            bandit-weekly-report.txt
            bandit-weekly-report.sarif
          retention-days: 30

      - name: Security scan summary
        run: |
          {
            echo "## 🛡️ Weekly Security Scan"
            echo ""
            echo "✅ Security scans completed"
            echo ""
            echo "**Reports uploaded:**"
            echo "- Bandit JSON report (artifact)"
            echo "- Bandit text report (artifact)"
            echo "- Bandit SARIF report (GitHub Security tab)"
          } >> "$GITHUB_STEP_SUMMARY"

  maintenance-summary:
    name: 📊 Maintenance Summary
    runs-on: ubuntu-latest
    needs: [dependency-check, security-audit]
    if: always()
    steps:
      - name: Generate summary
        run: |
          {
            echo "## 🔐 Weekly Maintenance Summary"
            echo ""
            echo "**Jobs Completed:**"
            echo "- Dependency Check: ${{ needs.dependency-check.result }}"
            echo "- Security Audit: ${{ needs.security-audit.result }}"
            echo ""
            echo "**Next scheduled run:** Next Monday at 21:12 CET"
          } >> "$GITHUB_STEP_SUMMARY"
