version: 2

updates:
  # Python package dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "21:12"
      timezone: "Europe/Copenhagen"
    groups:
      # Bundle patch + minor bumps into a single weekly PR per category.
      # Security advisories always come as separate PRs (Dependabot default).
      # Majors stay separate so they get a proper review.
      pip-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      pip-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Scan for Docker updates in Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "21:12"
      timezone: "Europe/Copenhagen"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Include GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "21:12"
      timezone: "Europe/Copenhagen"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
