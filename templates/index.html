<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Secret Generator</title>
    <link rel="icon" href="https://bondit.services/wp-content/uploads/2024/04/favcion-bondit.webp" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h2>Kubernetes Secret Generator</h2>
    <form method="post">
        <label for="secret_name">Meta Name:</label>
        <input type="text" id="secret_name" name="secret_name" value="{{ secret_name }}" required>
        <br><br>
        <label for="namespace">Meta Namespace:</label>
        <input type="text" id="namespace" name="namespace" value="{{ namespace }}" required>
        <br><br>
        <label for="format">Output Format:</label>
        <select id="format" name="format">
            <option value="json" {% if output_format != 'yaml' %}selected{% endif %}>JSON</option>
            <option value="yaml" {% if output_format == 'yaml' %}selected{% endif %}>YAML</option>
        </select>
        <br><br>
        <label for="labels">Labels (optional, comma-separated key=value):</label>
        <input type="text" id="labels" name="labels" value="{{ labels }}" placeholder="app=my-app,env=production">
        <br><br>
        <label for="annotations">Annotations (optional, comma-separated key=value):</label>
        <input type="text" id="annotations" name="annotations" value="{{ annotations }}" placeholder="owner=platform-team">
        <br><br>
        <label for="env_content">Paste .env content:</label>
        <textarea id="env_content" name="env_content"></textarea>
        <br>
        <button type="submit">Generate Secret</button>
    </form>

    {% if manifest_output %}
    <h3>Generated Kubernetes Secret Manifest:</h3>
    <pre>{{ manifest_output }}</pre>

    <form action="/download" method="post">
        <input type="hidden" name="env_content" value="{{ request.form['env_content'] }}">
        <input type="hidden" name="secret_name" value="{{ request.form['secret_name'] }}">
        <input type="hidden" name="namespace" value="{{ request.form['namespace'] }}">
        <input type="hidden" name="format" value="{{ output_format }}">
        <input type="hidden" name="labels" value="{{ labels }}">
        <input type="hidden" name="annotations" value="{{ annotations }}">
        <button type="submit">Download {{ 'YAML' if output_format == 'yaml' else 'JSON' }}</button>
    </form>
    {% endif %}

    <footer>
        <p><a href="https://github.com/MaBoNi/kubernetes-secret-generator" target="_blank">GitHub Repository</a></p>
        <p>&copy; 2025 BondIT ApS. All rights reserved under MIT License.</p>
    </footer>
</body>
</html>
